version: "3.9"

services:
  db:
    image: postgres:16
    container_name: dota-postgres
    restart: always
    environment:
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota123
      POSTGRES_DB: dota_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: